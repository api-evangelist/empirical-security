aid: empirical-security
name: Empirical Security
description: >-
  Empirical Security builds data-driven models that predict which
  vulnerabilities will actually be exploited, so security teams can
  prioritize remediation by real-world risk instead of raw CVSS severity.
  It operates the Foundation (global) model, which combines real-time
  internet exploitation telemetry with EPSS and monitors 18,000+ exploited
  CVEs; hourly-updated EPSS models (epss_v3, epss_v4, epss_v5); and Radiant,
  an organization-specific model that layers your local assets,
  configurations and internal telemetry on top of the Foundation data. The
  read-only REST API exposes CVE detail, per-model scores and percentiles,
  malware hashes, critical indicators, score history, change history, full
  dataset export, search, and saved CVE groups, secured with OAuth 2.0
  client credentials (JWT bearer). Empirical Security is backed by Costanoa
  Ventures.
