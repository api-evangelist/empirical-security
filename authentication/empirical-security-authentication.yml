notes: >-
  OAuth 2.0 client credentials via FusionAuth. Create an API Client under
  Settings -> API Clients in https://app.empiricalsecurity.com/, then POST
  to the FusionAuth token endpoint with HTTP Basic (client_id:client_secret),
  grant_type=client_credentials and the target-entity scope. The returned JWT
  (valid one hour) is sent as Authorization: Bearer <JWT> on API requests.
